<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>微检助手 · 临床微生物检验科工作小助手（完整版）</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #f0f4f8;
            color: #1a2c3e;
            height: 100vh;
            overflow: hidden;
        }
        .app-container { display: flex; height: 100%; width: 100%; overflow: hidden; }
        .sidebar {
            width: 280px;
            background: #ffffff;
            border-right: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            z-index: 10;
        }
        .logo-area { padding: 24px 20px 16px 24px; border-bottom: 1px solid #ecf3fa; }
        .logo-area h2 { font-size: 1.5rem; font-weight: 600; background: linear-gradient(135deg, #0f5b7a, #1e7b9e); background-clip: text; -webkit-background-clip: text; color: transparent; }
        .logo-area p { font-size: 0.75rem; color: #5b7a95; margin-top: 6px; }
        .nav-menu { flex: 1; padding: 20px 12px 20px 20px; }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            margin-bottom: 6px;
            border-radius: 14px;
            font-weight: 500;
            color: #2d4a6e;
            cursor: pointer;
            transition: 0.2s;
        }
        .nav-item i { width: 24px; font-size: 1.2rem; color: #5f8bb3; }
        .nav-item:hover { background: #eef3fc; color: #0f6b8c; }
        .nav-item.active { background: #e1f0fa; color: #0c6b8e; font-weight: 600; }
        .sidebar-footer { padding: 20px 20px 24px; font-size: 0.7rem; color: #7e95ab; border-top: 1px solid #e9edf2; }
        .main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; background: #f8fafc; }
        .top-bar {
            background: white;
            padding: 16px 28px;
            border-bottom: 1px solid #e2edf2;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            position: sticky;
            top: 0;
            z-index: 5;
        }
        .search-wrapper {
            flex: 2;
            min-width: 260px;
            display: flex;
            align-items: center;
            background: #f1f5f9;
            border-radius: 48px;
            padding: 6px 18px;
            border: 1px solid #e0e9f0;
        }
        .search-wrapper:focus-within { background: #ffffff; border-color: #2c9bcf; box-shadow: 0 0 0 3px rgba(44,155,207,0.1); }
        .search-wrapper input { border: none; background: transparent; padding: 10px 12px; font-size: 0.95rem; width: 100%; outline: none; }
        .search-wrapper button { background: none; border: none; cursor: pointer; color: #2c7fb8; padding: 6px 8px; }
        .badge-tips { background: #eef2ff; border-radius: 30px; padding: 6px 16px; font-size: 0.8rem; color: #1e6b8f; }
        .content-pane { padding: 24px 28px; }
        
        /* 卡片网格布局 */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 20px;
            margin-top: 16px;
        }
        .data-card {
            background: white;
            border-radius: 24px;
            padding: 18px 20px;
            border: 1px solid #e9f0f5;
            transition: 0.2s;
            position: relative;
        }
        .data-card:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.05); }
        .card-title { font-weight: 700; font-size: 1.1rem; color: #1f5575; border-left: 4px solid #2c9bcf; padding-left: 12px; margin-bottom: 12px; }
        .card-field { margin: 8px 0; font-size: 0.85rem; color: #2c4c6e; }
        .card-field strong { color: #1f5575; font-weight: 600; width: 100px; display: inline-block; }
        .card-actions {
            position: absolute;
            top: 16px;
            right: 16px;
            display: flex;
            gap: 10px;
        }
        .card-actions button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            color: #8aa9c4;
            transition: 0.2s;
        }
        .card-actions button:hover { color: #2c9bcf; }
        .toolbar-buttons {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        .btn-add, .btn-import {
            background: #2c9bcf;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 0.85rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-import { background: #5f8bb3; }
        .btn-add:hover { background: #1f7ea8; }
        .btn-import:hover { background: #4a6e8f; }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(3px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: white;
            border-radius: 32px;
            width: 500px;
            max-width: 90%;
            padding: 24px;
            box-shadow: 0 20px 30px rgba(0,0,0,0.2);
        }
        .modal-content h3 { margin-bottom: 20px; color: #1f5575; }
        .modal-content input, .modal-content textarea {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 16px;
            border: 1px solid #dce5ec;
            border-radius: 20px;
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
        }
        .modal-content textarea { min-height: 60px; resize: vertical; }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 8px;
        }
        .modal-actions button {
            padding: 8px 20px;
            border-radius: 40px;
            border: none;
            cursor: pointer;
        }
        .section-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin: 0 0 16px 0;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #1f4868;
            border-left: 5px solid #2c9bcf;
            padding-left: 16px;
        }
        .no-result { text-align: center; padding: 48px 20px; background: white; border-radius: 40px; color: #8aa9c4; }
        .dashboard-welcome { background: white; border-radius: 28px; padding: 20px 24px; margin-bottom: 28px; border: 1px solid #e5edf3; }
        .search-engine-directory { background: #ffffffea; border-radius: 28px; padding: 6px 12px 18px; margin-bottom: 28px; border: 1px solid #e2edf5; }
        .dir-grid { display: flex; flex-wrap: wrap; gap: 12px; padding: 12px; }
        .dir-chip { background: #eff6fc; border-radius: 40px; padding: 8px 18px; font-size: 0.8rem; font-weight: 500; color: #1b6c8f; cursor: pointer; border: 1px solid #dbe9f2; }
        
        /* 文件管理器垂直列表布局 */
        .file-list {
            margin-top: 20px;
            border: 1px solid #e2edf2;
            border-radius: 24px;
            background: white;
            overflow: hidden;
        }
        .file-list-header {
            display: flex;
            background: #f8fafc;
            padding: 12px 20px;
            border-bottom: 1px solid #e2edf2;
            font-weight: 600;
            color: #1f5575;
            font-size: 0.85rem;
        }
        .file-list-header .file-name-header { flex: 3; }
        .file-list-header .file-actions-header { flex: 1; text-align: right; }
        .file-list-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            border-bottom: 1px solid #eef2f6;
            transition: 0.1s;
        }
        .file-list-item:hover { background: #fafcff; }
        .file-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 3;
        }
        .file-icon-small {
            font-size: 1.4rem;
            color: #2c9bcf;
            width: 32px;
            text-align: center;
        }
        .file-name-text {
            font-size: 0.9rem;
            word-break: break-all;
            flex: 1;
        }
        .file-actions {
            display: flex;
            gap: 16px;
            justify-content: flex-end;
            flex: 1;
        }
        .file-actions button {
            background: none;
            border: none;
            cursor: pointer;
            color: #8aa9c4;
            font-size: 0.9rem;
            transition: 0.2s;
        }
        .file-actions button:hover { color: #2c9bcf; }
        .btn-upload {
            background: #2c9bcf;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 0.85rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-upload:hover { background: #1f7ea8; }
        .empty-files {
            background: white;
            border-radius: 28px;
            padding: 40px;
            text-align: center;
            color: #8aa9c4;
            margin-top: 20px;
        }
        
        /* 耐药数据样式 */
        .sub-tabs, .sub-sub-tabs { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 1px solid #e2edf2; }
        .sub-tab, .sub-sub-tab { background: #f0f4f9; padding: 6px 16px; border-radius: 40px; font-size: 0.85rem; font-weight: 500; color: #2c5a7a; cursor: pointer; transition: 0.2s; border: 1px solid #dce5ec; }
        .sub-tab.active, .sub-sub-tab.active { background: #2c9bcf; color: white; border-color: #2c9bcf; }
        .editable-content {
            background: white;
            border-radius: 24px;
            padding: 24px;
            min-height: 500px;
            font-size: 1rem;
            line-height: 1.6;
            outline: none;
            margin-top: 16px;
            border: 1px solid #e2edf2;
            overflow-y: auto;
        }
        .editable-toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            flex-wrap: wrap;
            align-items: center;
        }
        .editable-toolbar button {
            background: #eef2f6;
            border: none;
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 0.8rem;
            cursor: pointer;
            color: #2c5a7a;
        }
        .editable-toolbar button:hover { background: #d9e4ec; }
        .save-hint { font-size: 0.7rem; color: #5f8bb3; margin-top: 8px; text-align: right; }
        .attachment-list { margin-top: 20px; border-top: 1px solid #e2edf2; padding-top: 16px; }
        .attachment-title { font-weight: 600; margin-bottom: 10px; color: #1f5575; }
        .attachment-item { display: flex; align-items: center; justify-content: space-between; background: #f8fafc; padding: 8px 12px; border-radius: 20px; margin-bottom: 8px; }
        .attachment-name { font-size: 0.85rem; color: #2c5a7a; word-break: break-all; flex:1; }
        .attachment-actions button { background: none; border: none; cursor: pointer; margin-left: 8px; color: #2c9bcf; }
        .custom-table-wrapper { background: white; border-radius: 24px; padding: 12px; overflow-x: auto; margin-top: 24px; }
        .data-table { width: 100%; border-collapse: collapse; }
        .data-table th, .data-table td { border: 1px solid #e2e8f0; padding: 10px 8px; text-align: left; }
        .data-table th { background: #eef4fc; }
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            color: white;
            font-size: 1.2rem;
            backdrop-filter: blur(3px);
        }
        @media (max-width: 760px) {
            .sidebar { width: 80px; min-width: 80px; }
            .sidebar .logo-area h2, .logo-area p, .nav-item span, .sidebar-footer { display: none; }
            .nav-item { justify-content: center; padding: 12px 0; }
            .nav-item i { margin: 0; font-size: 1.5rem; }
            .top-bar { flex-direction: column; align-items: stretch; }
            .content-pane { padding: 16px; }
            .card-grid { grid-template-columns: 1fr; }
            .file-list-header { display: none; }
            .file-list-item { flex-direction: column; align-items: flex-start; gap: 8px; }
            .file-info { width: 100%; }
            .file-actions { width: 100%; justify-content: flex-start; margin-top: 8px; }
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="sidebar">
        <div class="logo-area">
            <h2><i class="fas fa-microscope"></i> 微检助手</h2>
            <p><i class="fas fa-flask"></i> 临床微生物检验科 · 知识中枢</p>
        </div>
        <div class="nav-menu">
            <div class="nav-item active" data-nav="dashboard"><i class="fas fa-tachometer-alt"></i> <span>工作台 · 总览</span></div>
            <div class="nav-item" data-nav="bacteria"><i class="fas fa-bacteria"></i> <span>细菌目录库</span></div>
            <div class="nav-item" data-nav="fungus"><i class="fas fa-leaf"></i> <span>真菌目录库</span></div>
            <div class="nav-item" data-nav="antibiotic"><i class="fas fa-capsules"></i> <span>抗生素 & 药敏</span></div>
            <div class="nav-item" data-nav="microbe_projects"><i class="fas fa-vial"></i> <span>检验科项目</span></div>
            <div class="nav-item" data-nav="resistance_data"><i class="fas fa-chart-line"></i> <span>耐药数据</span></div>
            <div class="nav-item" data-nav="natural_resistance"><i class="fas fa-table-list"></i> <span>天然耐药表</span></div>
            <div class="nav-item" data-nav="protocol"><i class="fas fa-clinic-medical"></i> <span>检验规程 / SOP</span></div>
            <div class="nav-item" data-nav="qc"><i class="fas fa-chart-line"></i> <span>质控标准</span></div>
        </div>
        <div class="sidebar-footer"><i class="fas fa-database"></i> 全功能版 · 现代工作台</div>
    </div>

    <div class="main-content">
        <div class="top-bar">
            <div class="search-wrapper">
                <i class="fas fa-search"></i>
                <input type="text" id="globalSearchInput" placeholder="搜索菌种、真菌、项目、文件..." autocomplete="off">
                <button id="clearSearchBtn"><i class="fas fa-times-circle"></i></button>
            </div>
            <div class="badge-tips"><i class="fas fa-file-excel"></i> 细菌/真菌支持Excel批量导入 | 文件列表垂直布局</div>
        </div>
        <div class="content-pane" id="dynamicContent"><div class="loading">加载中...</div></div>
    </div>
</div>

<script>
    // ======================= IndexedDB 初始化 =======================
    const DB_NAME = 'MicroLabDB';
    const DB_VERSION = 6;
    const STORE_RESISTANCE = 'resistance_contents';
    const STORE_ATTACHMENTS = 'attachments';
    const STORE_NATURAL = 'natural_content';
    const STORE_BACTERIA = 'bacteria_items';
    const STORE_FUNGUS = 'fungus_items';
    const STORE_PROJECTS = 'microbe_projects_items';
    const STORE_FILES = 'file_items';
    let db = null;

    function openDB() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open(DB_NAME, DB_VERSION);
            request.onerror = () => reject(request.error);
            request.onsuccess = () => {
                db = request.result;
                resolve(db);
            };
            request.onupgradeneeded = (event) => {
                const dbUp = event.target.result;
                if (!dbUp.objectStoreNames.contains(STORE_RESISTANCE)) dbUp.createObjectStore(STORE_RESISTANCE, { keyPath: 'key' });
                if (!dbUp.objectStoreNames.contains(STORE_ATTACHMENTS)) dbUp.createObjectStore(STORE_ATTACHMENTS, { keyPath: 'key' });
                if (!dbUp.objectStoreNames.contains(STORE_NATURAL)) dbUp.createObjectStore(STORE_NATURAL, { keyPath: 'key' });
                if (!dbUp.objectStoreNames.contains(STORE_BACTERIA)) {
                    const bs = dbUp.createObjectStore(STORE_BACTERIA, { keyPath: 'id', autoIncrement: true });
                    bs.createIndex('name', 'name');
                }
                if (!dbUp.objectStoreNames.contains(STORE_FUNGUS)) {
                    const fs = dbUp.createObjectStore(STORE_FUNGUS, { keyPath: 'id', autoIncrement: true });
                    fs.createIndex('name', 'name');
                }
                if (!dbUp.objectStoreNames.contains(STORE_PROJECTS)) {
                    const ps = dbUp.createObjectStore(STORE_PROJECTS, { keyPath: 'id', autoIncrement: true });
                    ps.createIndex('name', 'name');
                }
                if (!dbUp.objectStoreNames.contains(STORE_FILES)) {
                    dbUp.createObjectStore(STORE_FILES, { keyPath: 'key' });
                }
            };
        });
    }

    // ======================= 文件操作 =======================
    async function getFilesByPrefix(prefix) {
        if(!db) await openDB();
        const tx = db.transaction([STORE_FILES], 'readonly');
        const store = tx.objectStore(STORE_FILES);
        const range = IDBKeyRange.bound(prefix, prefix + '\uffff');
        const request = store.getAll(range);
        return new Promise(resolve => { request.onsuccess = () => resolve(request.result || []); request.onerror = () => resolve([]); });
    }
    async function saveFile(key, name, blob, mime, size) {
        if(!db) await openDB();
        const tx = db.transaction([STORE_FILES], 'readwrite');
        const store = tx.objectStore(STORE_FILES);
        store.put({ key, name, blob, mime, size, uploadTime: Date.now() });
        return new Promise((resolve, reject) => { tx.oncomplete = resolve; tx.onerror = () => reject(tx.error); });
    }
    async function deleteFile(key) {
        if(!db) await openDB();
        const tx = db.transaction([STORE_FILES], 'readwrite');
        const store = tx.objectStore(STORE_FILES);
        store.delete(key);
        return new Promise((resolve, reject) => { tx.oncomplete = resolve; tx.onerror = () => reject(tx.error); });
    }
    async function updateFileName(key, newName) {
        if(!db) await openDB();
        const tx = db.transaction([STORE_FILES], 'readwrite');
        const store = tx.objectStore(STORE_FILES);
        const req = store.get(key);
        return new Promise((resolve, reject) => {
            req.onsuccess = async () => {
                const item = req.result;
                if(item) { item.name = newName; store.put(item); tx.oncomplete = resolve; }
                else resolve();
            };
            req.onerror = () => reject(req.error);
        });
    }

    // ======================= 文件管理器渲染（垂直列表布局） =======================
    async function renderFileManager(moduleKey, moduleTitle) {
        const container = document.getElementById("dynamicContent");
        if(!container) return;
        const prefix = moduleKey + '_';
        const files = await getFilesByPrefix(prefix);
        let html = `<div class="section-title"><i class="fas fa-file-alt"></i> ${moduleTitle}</div>
                    <div style="margin-bottom:20px;"><button class="btn-upload" id="uploadFilesBtn"><i class="fas fa-upload"></i> 上传文件</button></div>`;
        if(files.length === 0){
            html += `<div class="empty-files">暂无文件，点击上方按钮上传 Word/PDF/PPT 等文件</div>`;
        } else {
            html += `<div class="file-list">
                        <div class="file-list-header">
                            <div class="file-name-header">文件名</div>
                            <div class="file-actions-header">操作</div>
                        </div>`;
            for(const file of files){
                const ext = file.name.split('.').pop().toLowerCase();
                let iconClass = 'fa-file-alt';
                if(ext === 'pdf') iconClass = 'fa-file-pdf';
                else if(ext === 'doc' || ext === 'docx') iconClass = 'fa-file-word';
                else if(ext === 'ppt' || ext === 'pptx') iconClass = 'fa-file-powerpoint';
                else if(ext === 'xls' || ext === 'xlsx') iconClass = 'fa-file-excel';
                else if(ext === 'txt') iconClass = 'fa-file-text';
                html += `<div class="file-list-item" data-key="${file.key}">
                            <div class="file-info">
                                <div class="file-icon-small"><i class="fas ${iconClass}"></i></div>
                                <div class="file-name-text" title="${escapeHtml(file.name)}">${escapeHtml(file.name)}</div>
                            </div>
                            <div class="file-actions">
                                <button class="edit-filename" data-key="${file.key}" data-name="${escapeHtml(file.name)}"><i class="fas fa-edit"></i> 重命名</button>
                                <button class="download-file" data-key="${file.key}"><i class="fas fa-download"></i> 下载</button>
                                <button class="delete-file" data-key="${file.key}"><i class="fas fa-trash-alt"></i> 删除</button>
                            </div>
                        </div>`;
            }
            html += `</div>`;
        }
        container.innerHTML = html;
        
        document.getElementById('uploadFilesBtn')?.addEventListener('click', () => {
            const input = document.createElement('input');
            input.type = 'file';
            input.multiple = true;
            input.accept = '.pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.txt';
            input.onchange = async (e) => {
                const filesList = Array.from(e.target.files);
                if(filesList.length === 0) return;
                for(const f of filesList) {
                    const key = prefix + Date.now() + '_' + f.name;
                    const blob = await f.arrayBuffer().then(buf => new Blob([buf], {type: f.type}));
                    await saveFile(key, f.name, blob, f.type, f.size);
                }
                await renderFileManager(moduleKey, moduleTitle);
                showToast(`已上传 ${filesList.length} 个文件`, 'success');
            };
            input.click();
        });
        
        document.querySelectorAll('.edit-filename').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                e.stopPropagation();
                const key = btn.getAttribute('data-key');
                const oldName = btn.getAttribute('data-name');
                const newName = prompt('请输入新文件名', oldName);
                if(newName && newName.trim() && newName !== oldName) {
                    await updateFileName(key, newName.trim());
                    await renderFileManager(moduleKey, moduleTitle);
                    showToast('文件名已更新', 'success');
                }
            });
        });
        
        document.querySelectorAll('.download-file').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                e.stopPropagation();
                const key = btn.getAttribute('data-key');
                if(!db) await openDB();
                const tx = db.transaction([STORE_FILES], 'readonly');
                const store = tx.objectStore(STORE_FILES);
                const req = store.get(key);
                req.onsuccess = () => {
                    const file = req.result;
                    if(file && file.blob) {
                        const url = URL.createObjectURL(file.blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = file.name;
                        a.click();
                        URL.revokeObjectURL(url);
                    } else { showToast('文件不存在', 'error'); }
                };
            });
        });
        
        document.querySelectorAll('.delete-file').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                e.stopPropagation();
                if(confirm('确定删除该文件吗？')) {
                    const key = btn.getAttribute('data-key');
                    await deleteFile(key);
                    await renderFileManager(moduleKey, moduleTitle);
                    showToast('已删除', 'success');
                }
            });
        });
    }

    // 导入细菌Excel
    async function importBacteriaExcel() {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = '.xlsx,.xls,.csv';
        input.onchange = async (e) => {
            const file = e.target.files[0];
            if(!file) return;
            const loader = document.createElement('div'); loader.className = 'loading-overlay'; loader.innerHTML = '<div>解析中...</div>'; document.body.appendChild(loader);
            try {
                const data = await file.arrayBuffer();
                const workbook = XLSX.read(data, { type: 'array' });
                const sheet = workbook.Sheets[workbook.SheetNames[0]];
                const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
                if(!rows || rows.length < 2) throw new Error('至少需要标题行');
                const headers = rows[0].map(c=>String(c||"").trim());
                const nameIdx = headers.findIndex(h=>h.includes('中文名称')||h.includes('名称'));
                const engIdx = headers.findIndex(h=>h.includes('英文名称'));
                const charIdx = headers.findIndex(h=>h.includes('一般特性')||h.includes('特性'));
                const clinIdx = headers.findIndex(h=>h.includes('临床相关性')||h.includes('临床'));
                const susIdx = headers.findIndex(h=>h.includes('药敏测试')||h.includes('药敏'));
                if(nameIdx === -1) throw new Error('未找到中文名称列');
                let count = 0;
                for(let i=1; i<rows.length; i++){
                    const row = rows[i];
                    if(!row || row.length===0) continue;
                    const name = row[nameIdx] ? String(row[nameIdx]).trim() : '';
                    if(!name) continue;
                    const english = engIdx!==-1 && row[engIdx] ? String(row[engIdx]).trim() : '';
                    const characteristics = charIdx!==-1 && row[charIdx] ? String(row[charIdx]).trim() : '';
                    const clinical = clinIdx!==-1 && row[clinIdx] ? String(row[clinIdx]).trim() : '';
                    const susceptibility = susIdx!==-1 && row[susIdx] ? String(row[susIdx]).trim() : '';
                    const all = await getAllBacteria();
                    const existing = all.find(b=>b.name===name);
                    if(existing) {
                        existing.englishName = english; existing.characteristics = characteristics; existing.clinical = clinical; existing.susceptibility = susceptibility;
                        await saveBacteriaItem(existing);
                    } else {
                        await saveBacteriaItem({ name, englishName: english, characteristics, clinical, susceptibility });
                    }
                    count++;
                }
                showToast(`导入完成，共处理 ${count} 条细菌`, 'success');
                await renderBacteriaModule();
            } catch(err) { alert('导入失败：'+err.message); } finally { loader.remove(); }
        };
        input.click();
    }

    async function insertImagesSorted(editor){
        const input=document.createElement('input'); input.type='file'; input.accept='image/*'; input.multiple=true;
        input.onchange=async (e)=>{
            const files=Array.from(e.target.files); if(files.length===0) return;
            files.sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));
            const loader=document.createElement('div'); loader.className='loading-overlay'; loader.innerHTML='<div>处理图片中...</div>'; document.body.appendChild(loader);
            try{
                let imgsHtml='';
                for(const file of files){
                    const dataURL=await new Promise((resolve,reject)=>{ const reader=new FileReader(); reader.onload=(ev)=>resolve(ev.target.result); reader.onerror=reject; reader.readAsDataURL(file); });
                    imgsHtml+=`<img src="${dataURL}" alt="${file.name}" style="max-width:100%; margin:12px 0; border-radius:12px;"><br>`;
                }
                const sel=window.getSelection();
                if(sel && sel.rangeCount>0 && editor.contains(sel.anchorNode)){
                    const range=sel.getRangeAt(0);
                    const frag=range.createContextualFragment(imgsHtml);
                    range.insertNode(frag);
                    range.collapse(false);
                    sel.removeAllRanges();
                    sel.addRange(range);
                } else editor.insertAdjacentHTML('beforeend',imgsHtml);
                showToast(`已插入 ${files.length} 张图片，请保存`,"success");
            } catch(err){ showToast("图片处理失败","error"); } finally{ loader.remove(); }
        };
        input.click();
    }

    // 绑定工作台事件（任务保存/加载、快捷跳转）
    function bindDashboardEvents() {
    const NOTICE_STORAGE_KEY = 'dashboard_notices';
    const TASK_STORAGE_KEY = 'dashboard_tasks';

    // 公告操作
    function saveNotices() {
        const notices = [];
        document.querySelectorAll('#noticeList .notice-item').forEach(item => {
            const textSpan = item.querySelector('.notice-text');
            const timeSpan = item.querySelector('.notice-time');
            notices.push({ text: textSpan.innerText, time: timeSpan.innerText });
        });
        localStorage.setItem(NOTICE_STORAGE_KEY, JSON.stringify(notices));
    }
    function loadNotices() {
        const saved = localStorage.getItem(NOTICE_STORAGE_KEY);
        const noticeContainer = document.getElementById('noticeList');
        if (!noticeContainer) return;
        noticeContainer.innerHTML = '';
        let notices = saved ? JSON.parse(saved) : [
            { text: "📢 2025年CLSI M100文件已更新，请查阅", time: "昨天" },
            { text: "🔔 本月院感监测报告已上传至『检验规程』", time: "前天" },
            { text: "⚠️ 质控中心提醒：碳青霉烯酶表型检测注意质量控制", time: "3天前" }
        ];
        notices.forEach((n, idx) => {
            const div = document.createElement('div');
            div.className = 'notice-item';
            div.style.padding = '10px 0';
            div.style.borderBottom = '1px solid #eef2f6';
            div.style.display = 'flex';
            div.style.justifyContent = 'space-between';
            div.style.alignItems = 'center';
            div.innerHTML = `
                <div>
                    <span class="notice-text" style="font-size:0.85rem;">${escapeHtml(n.text)}</span>
                    <span class="notice-time" style="font-size:0.7rem; color:#8aa9c4; margin-left:8px;">${escapeHtml(n.time)}</span>
                </div>
                <button class="delete-notice" data-idx="${idx}" style="background:none; border:none; color:#8aa9c4; cursor:pointer;"><i class="fas fa-trash-alt"></i></button>
            `;
            noticeContainer.appendChild(div);
        });
        // 绑定删除事件
        document.querySelectorAll('.delete-notice').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const idx = parseInt(btn.getAttribute('data-idx'));
                let notices = JSON.parse(localStorage.getItem(NOTICE_STORAGE_KEY) || '[]');
                notices.splice(idx, 1);
                localStorage.setItem(NOTICE_STORAGE_KEY, JSON.stringify(notices));
                loadNotices(); // 重新渲染
            });
        });
    }
    // 添加公告
    const addNoticeBtn = document.getElementById('addNoticeBtn');
    const noticeInput = document.getElementById('newNoticeInput');
    if (addNoticeBtn) {
        addNoticeBtn.addEventListener('click', () => {
            const text = noticeInput.value.trim();
            if (text) {
                let notices = JSON.parse(localStorage.getItem(NOTICE_STORAGE_KEY) || '[]');
                const now = new Date();
                const timeStr = `${now.getMonth()+1}/${now.getDate()} ${now.getHours()}:${now.getMinutes()}`;
                notices.unshift({ text, time: timeStr });
                localStorage.setItem(NOTICE_STORAGE_KEY, JSON.stringify(notices));
                noticeInput.value = '';
                loadNotices();
                showToast('公告已添加', 'success');
            }
        });
    }

    // 任务操作（保留原有，增加删除按钮）
    function saveTasks() {
        const tasks = [];
        document.querySelectorAll('#taskList .task-item').forEach(item => {
            const checkbox = item.querySelector('input');
            const label = item.querySelector('label');
            tasks.push({ text: label.innerText, done: checkbox.checked });
        });
        localStorage.setItem(TASK_STORAGE_KEY, JSON.stringify(tasks));
    }
    function loadTasks() {
        const saved = localStorage.getItem(TASK_STORAGE_KEY);
        const taskContainer = document.getElementById('taskList');
        if (!taskContainer) return;
        taskContainer.innerHTML = '';
        let tasks = saved ? JSON.parse(saved) : [
            { text: "完成本周耐药数据汇总", done: false },
            { text: "更新细菌目录库中的MRSA药敏信息", done: false }
        ];
        tasks.forEach((t, idx) => {
            const div = document.createElement('div');
            div.className = 'task-item';
            div.style.padding = '10px 0';
            div.style.borderBottom = '1px solid #eef2f6';
            div.style.display = 'flex';
            div.style.justifyContent = 'space-between';
            div.style.alignItems = 'center';
            div.innerHTML = `
                <div style="display:flex; align-items:center; gap:10px;">
                    <input type="checkbox" id="task_${idx}" ${t.done ? 'checked' : ''} style="width:18px;height:18px;">
                    <label for="task_${idx}" style="font-size:0.85rem; ${t.done ? 'text-decoration:line-through; color:#8aa9c4;' : ''}">${escapeHtml(t.text)}</label>
                </div>
                <button class="delete-task" data-idx="${idx}" style="background:none; border:none; color:#8aa9c4; cursor:pointer;"><i class="fas fa-trash-alt"></i></button>
            `;
            taskContainer.appendChild(div);
        });
        // 绑定checkbox变化
        document.querySelectorAll('#taskList input[type="checkbox"]').forEach(cb => {
            cb.addEventListener('change', () => saveTasks());
        });
        // 绑定删除任务
        document.querySelectorAll('.delete-task').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const idx = parseInt(btn.getAttribute('data-idx'));
                let tasks = JSON.parse(localStorage.getItem(TASK_STORAGE_KEY) || '[]');
                tasks.splice(idx, 1);
                localStorage.setItem(TASK_STORAGE_KEY, JSON.stringify(tasks));
                loadTasks();
            });
        });
    }
    // 添加任务
    const addTaskBtn = document.getElementById('addTaskBtn');
    const taskInput = document.getElementById('newTaskInput');
    if (addTaskBtn) {
        addTaskBtn.addEventListener('click', () => {
            const text = taskInput.value.trim();
            if (text) {
                let tasks = JSON.parse(localStorage.getItem(TASK_STORAGE_KEY) || '[]');
                tasks.push({ text, done: false });
                localStorage.setItem(TASK_STORAGE_KEY, JSON.stringify(tasks));
                taskInput.value = '';
                loadTasks();
                showToast('任务已添加', 'success');
            }
        });
    }

    // 加载初始数据
    loadNotices();
    loadTasks();

    // 快捷链接跳转（保持不变）
    document.querySelectorAll('.quick-link-item').forEach(link => {
        link.addEventListener('click', () => {
            const nav = link.getAttribute('data-nav');
            const action = link.getAttribute('data-action');
            if (nav) {
                const navItem = document.querySelector(`.nav-item[data-nav="${nav}"]`);
                if (navItem) navItem.click();
                if (nav === 'bacteria' && action === 'addBacteria') {
                    setTimeout(() => { document.getElementById('addBacteriaBtn')?.click(); }, 100);
                } else if (nav === 'bacteria' && action === 'import') {
                    setTimeout(() => { document.getElementById('importBacteriaBtn')?.click(); }, 100);
                }
            }
        });
    });
}
    
    // 全局搜索
    async function globalSearch(kw){
        if(!kw.trim()) return {bacteria:[],fungi:[],projects:[],resistance:[]};
        const lower=kw.trim().toLowerCase();
        const bacteria=await getAllBacteria(); const fungi=await getAllFungi(); const projects=await getAllProjects();
        const matchedBacteria=bacteria.filter(b=>(b.name&&b.name.toLowerCase().includes(lower))||(b.englishName&&b.englishName.toLowerCase().includes(lower))||(b.characteristics&&b.characteristics.toLowerCase().includes(lower))||(b.clinical&&b.clinical.toLowerCase().includes(lower))||(b.susceptibility&&b.susceptibility.toLowerCase().includes(lower)));
        const matchedFungi=fungi.filter(f=>(f.name&&f.name.toLowerCase().includes(lower))||(f.englishName&&f.englishName.toLowerCase().includes(lower))||(f.characteristics&&f.characteristics.toLowerCase().includes(lower))||(f.clinical&&f.clinical.toLowerCase().includes(lower))||(f.susceptibility&&f.susceptibility.toLowerCase().includes(lower)));
        const matchedProjects=projects.filter(p=>(p.name&&p.name.toLowerCase().includes(lower))||(p.code&&p.code.toLowerCase().includes(lower))||(p.shortCode&&p.shortCode.toLowerCase().includes(lower))||(p.detail&&p.detail.toLowerCase().includes(lower)));
        const allRes=await getAllResistanceContents(); const matchedRes=[];
        for(const rc of allRes){ if(rc.html && rc.html.toLowerCase().includes(lower)){ let title=rc.key; for(const sec of subSections){ if(rc.key===`content_${sec.id}`){ title=sec.name; break; } if(sec.children){ for(const child of sec.children){ if(rc.key===`content_${sec.id}_${child.id}`){ title=`${sec.name} - ${child.name}`; break; } } } } matchedRes.push({title, snippet:rc.html.replace(/<[^>]+>/g,' ').substring(0,100)+'...', key:rc.key }); } }
        return {bacteria:matchedBacteria, fungi:matchedFungi, projects:matchedProjects, resistance:matchedRes};
    }
    async function renderSearchResults(kw){
        const {bacteria,fungi,projects,resistance}=await globalSearch(kw);
        const container=document.getElementById("dynamicContent");
        if(bacteria.length===0 && fungi.length===0 && projects.length===0 && resistance.length===0){ container.innerHTML=`<div class="no-result">未找到相关</div>`; return; }
        let html=`<div class="section-title">搜索结果：“${escapeHtml(kw)}”</div>`;
        if(projects.length){ html+=`<div class="section-title" style="font-size:1rem;">🧪 微生物项目 (${projects.length})</div><div class="card-grid">`; for(const p of projects) html+=`<div class="data-card"><div class="card-title">${escapeHtml(p.name)}</div><div class="card-field"><strong>编码：</strong> ${escapeHtml(p.code||'-')}</div><div class="card-field"><strong>简码：</strong> ${escapeHtml(p.shortCode||'-')}</div><div class="card-field"><strong>价格：</strong> ${escapeHtml(p.price||'-')}</div><div class="card-field"><strong>出报告时间：</strong> ${escapeHtml(p.reportTime||'-')}</div></div>`; html+=`</div>`; }
        if(bacteria.length){ html+=`<div class="section-title">🧫 细菌 (${bacteria.length})</div><div class="card-grid">`; for(const b of bacteria) html+=`<div class="data-card"><div class="card-title">${escapeHtml(b.name)}</div><div class="card-field"><strong>一般特性：</strong> ${escapeHtml(b.characteristics||'')}</div><div class="card-field"><strong>临床相关性：</strong> ${escapeHtml(b.clinical||'')}</div><div class="card-field"><strong>药敏：</strong> ${escapeHtml(b.susceptibility||'')}</div></div>`; html+=`</div>`; }
        if(fungi.length){ html+=`<div class="section-title">🍄 真菌 (${fungi.length})</div><div class="card-grid">`; for(const f of fungi) html+=`<div class="data-card"><div class="card-title">${escapeHtml(f.name)}</div><div class="card-field"><strong>一般特性：</strong> ${escapeHtml(f.characteristics||'')}</div><div class="card-field"><strong>临床相关性：</strong> ${escapeHtml(f.clinical||'')}</div><div class="card-field"><strong>药敏：</strong> ${escapeHtml(f.susceptibility||'')}</div></div>`; html+=`</div>`; }
        if(resistance.length){ html+=`<div class="section-title">📈 耐药数据 (${resistance.length})</div><div class="card-grid">`; for(const r of resistance) html+=`<div class="data-card search-res-card" data-reskey="${r.key}"><div class="card-title">${escapeHtml(r.title)}</div><div class="card-summary">${escapeHtml(r.snippet)}</div><div class="keywords">点击跳转</div></div>`; html+=`</div>`; }
        container.innerHTML=html;
        document.querySelectorAll('.search-res-card').forEach(card=>{ card.addEventListener('click',async()=>{ const key=card.getAttribute('data-reskey'); let parts=key.replace(/^content_/,'').split('_'); let level1Id=parts[0], level2Id=parts.length>1?parts[1]:null; let idx=subSections.findIndex(s=>s.id===level1Id); if(idx!==-1){ currentNav="resistance_data"; updateActiveNav("resistance_data"); currentActiveSub=idx; if(level2Id && subSections[idx].children){ let childIdx=subSections[idx].children.findIndex(c=>c.id===level2Id); if(childIdx!==-1) currentActiveSubSub=childIdx; else currentActiveSubSub=0; } else currentActiveSubSub=0; await renderResistanceModule(); } }); });
    }
    
    let currentNav="dashboard", currentSearchKeyword="";
    async function renderMain(){
        if(currentSearchKeyword){ await renderSearchResults(currentSearchKeyword); return; }
        if(currentNav==='dashboard') {
            document.getElementById("dynamicContent").innerHTML = renderDashboard();
            bindDashboardEvents();
            attachDirChipEvents();
        } else if(currentNav==='bacteria') await renderBacteriaModule();
        else if(currentNav==='fungus') await renderFungusModule();
        else if(currentNav==='microbe_projects') await renderMicrobeProjectsModule();
        else if(currentNav==='resistance_data') await renderResistanceModule();
        else if(currentNav==='natural_resistance') await renderNaturalResistance();
        else if(currentNav==='antibiotic') await renderFileManager('antibiotic', '抗生素 & 药敏');
        else if(currentNav==='protocol') await renderFileManager('protocol', '检验规程 / SOP');
        else if(currentNav==='qc') await renderFileManager('qc', '质控标准');
        else attachDirChipEvents();
    }
    function attachDirChipEvents(){
        document.querySelectorAll('.dir-chip').forEach(chip=>{
            chip.removeEventListener('click',chip._listener);
            const handler=()=>{ const kw=chip.innerText.trim(); document.getElementById('globalSearchInput').value=kw; currentSearchKeyword=kw; renderMain(); };
            chip.addEventListener('click',handler);
            chip._listener=handler;
        });
    }
    function updateActiveNav(nav){
        document.querySelectorAll('.nav-item').forEach(item=>{ if(item.getAttribute('data-nav')===nav) item.classList.add('active'); else item.classList.remove('active'); });
    }
    function bindNavEvents(){
        document.querySelectorAll('.nav-item').forEach(item=>{
            item.addEventListener('click',async()=>{
                const nav=item.getAttribute('data-nav');
                if(!nav) return;
                currentNav=nav;
                currentSearchKeyword="";
                document.getElementById('globalSearchInput').value="";
                updateActiveNav(nav);
                await renderMain();
            });
        });
    }
    function bindSearchEvents(){
        const input=document.getElementById('globalSearchInput'), clearBtn=document.getElementById('clearSearchBtn');
        const doSearch=()=>{ const kw=input.value.trim(); currentSearchKeyword=kw||""; renderMain(); };
        input.addEventListener('keyup',(e)=>{ if(e.key==='Enter') doSearch(); });
        clearBtn.addEventListener('click',()=>{ input.value=""; doSearch(); });
        document.querySelector('.search-wrapper button')?.addEventListener('click',doSearch);
    }
    function addModalsToBody(){
        const bacteriaModal=document.createElement('div'); bacteriaModal.id='bacteriaModal'; bacteriaModal.className='modal';
        bacteriaModal.innerHTML=`<div class="modal-content"><h3 id="bacteriaModalTitle">新增细菌</h3><input id="bacteriaName" placeholder="中文名称 *"><input id="bacteriaEnglish" placeholder="英文名称"><textarea id="bacteriaChar" placeholder="一般特性"></textarea><textarea id="bacteriaClinical" placeholder="临床相关性"></textarea><textarea id="bacteriaSus" placeholder="药敏测试信息"></textarea><div class="modal-actions"><button id="bacteriaCancelBtn">取消</button><button id="bacteriaSaveBtn">保存</button></div></div>`;
        document.body.appendChild(bacteriaModal);
        document.getElementById('bacteriaCancelBtn').addEventListener('click',closeBacteriaModal);
        document.getElementById('bacteriaSaveBtn').addEventListener('click',saveBacteriaModal);
        const fungusModal=document.createElement('div'); fungusModal.id='fungusModal'; fungusModal.className='modal';
        fungusModal.innerHTML=`<div class="modal-content"><h3 id="fungusModalTitle">新增真菌</h3><input id="fungusName" placeholder="中文名称 *"><input id="fungusEnglish" placeholder="英文名称"><textarea id="fungusChar" placeholder="一般特性"></textarea><textarea id="fungusClinical" placeholder="临床相关性"></textarea><textarea id="fungusSus" placeholder="药敏测试信息"></textarea><div class="modal-actions"><button id="fungusCancelBtn">取消</button><button id="fungusSaveBtn">保存</button></div></div>`;
        document.body.appendChild(fungusModal);
        document.getElementById('fungusCancelBtn').addEventListener('click',closeFungusModal);
        document.getElementById('fungusSaveBtn').addEventListener('click',saveFungusModal);
        const projectModal=document.createElement('div'); projectModal.id='projectModal'; projectModal.className='modal';
        projectModal.innerHTML=`<div class="modal-content"><h3 id="projectModalTitle">新增项目</h3><input id="projectName" placeholder="项目名称 *"><input id="projectCode" placeholder="编码"><input id="projectShortCode" placeholder="简码"><input id="projectPrice" placeholder="价格"><textarea id="projectDetail" placeholder="细项"></textarea><input id="projectReportTime" placeholder="出报告时间"><div class="modal-actions"><button id="projectCancelBtn">取消</button><button id="projectSaveBtn">保存</button></div></div>`;
        document.body.appendChild(projectModal);
        document.getElementById('projectCancelBtn').addEventListener('click',closeProjectModal);
        document.getElementById('projectSaveBtn').addEventListener('click',saveProjectModal);
    }
    function escapeHtml(str){ if(!str) return ''; return str.replace(/[&<>]/g, m=>m==='&'?'&amp;':m==='<'?'&lt;':'&gt;'); }
    function showToast(msg,type){ let t=document.createElement('div'); t.textContent=msg; t.style.cssText=`position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:${type==='success'?'#1f8a4c':'#2c9bcf'}; color:white; padding:8px 20px; border-radius:40px; z-index:9999;`; document.body.appendChild(t); setTimeout(()=>t.remove(),2000); }
    
    async function init(){
        await openDB();
        let bacteria=await getAllBacteria(); if(bacteria.length===0){ await saveBacteriaItem({name:"金黄色葡萄球菌",englishName:"Staphylococcus aureus",characteristics:"革兰阳性球菌",clinical:"皮肤软组织感染",susceptibility:"MRSA需万古霉素"}); await saveBacteriaItem({name:"大肠埃希菌",englishName:"Escherichia coli",characteristics:"革兰阴性杆菌",clinical:"尿路感染",susceptibility:"ESBL菌株碳青霉烯敏感"}); }
        let fungi=await getAllFungi(); if(fungi.length===0){ await saveFungusItem({name:"白念珠菌",englishName:"Candida albicans",characteristics:"酵母样真菌",clinical:"口腔、阴道感染",susceptibility:"氟康唑敏感"}); }
        addModalsToBody();
        bindNavEvents();
        bindSearchEvents();
        currentNav="dashboard";
        updateActiveNav("dashboard");
        await renderMain();
    }
    init();
</script>
